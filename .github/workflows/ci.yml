name: Shell checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash -n githubcommit.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck githubcommit.sh
